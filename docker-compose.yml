# PostgreSQL 16 для проекта. Запуск: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst   # учебный пароль, только для локальной машины
      POSTGRES_DB: vacancies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипт создаёт тестовую базу при первом старте контейнера
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d vacancies"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
