<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacancy Analyzer</title>
<meta name="description" content="Interactive walkthrough of a systems analyst project: from a business question to SQL and charts">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">☰</button>
  <div class="brand" data-i18n="brand"></div>
  <button class="lang-toggle" id="langToggle">EN</button>
  <button class="theme-toggle" id="themeToggle" aria-label="Theme">◐</button>
</header>

<nav class="sidebar" id="sidebar" aria-label="Sections">
  <ol id="navList"></ol>
  <p class="sidebar-note" data-i18n="sidebarNote"></p>
</nav>

<main id="main">
  <section id="map" class="section">
    <h1 data-i18n="h_map"></h1>
    <p class="lead" data-i18n="lead_map"></p>
    <div class="stats" id="stats"></div>
    <div class="map-wrap">
      <svg id="mapSvg" viewBox="0 0 1000 330" role="img" aria-label="Data flow"></svg>
    </div>
    <div class="row gap">
      <button class="btn primary" id="animBtn" data-i18n="animBtn"></button>
      <span class="muted" id="animCaption" data-i18n="animCaption"></span>
    </div>
    <div class="panel" id="mapDetails"><p class="muted" data-i18n="mapPlaceholder"></p></div>
  </section>

  <section id="thinking" class="section">
    <h1 data-i18n="h_thinking"></h1>
    <p class="lead" data-i18n="lead_thinking"></p>
    <div id="thinkingSteps"></div>
    <h2 data-i18n="h2_mistakes"></h2>
    <div id="mistakes" class="cards"></div>
  </section>

  <section id="requirements" class="section">
    <h1 data-i18n="h_requirements"></h1>
    <p class="lead" data-i18n="lead_requirements"></p>
    <h2 data-i18n="h2_stories"></h2>
    <div id="stories" class="cards"></div>
    <h2 data-i18n="h2_usecases"></h2>
    <div id="usecases"></div>
    <h2 data-i18n="h2_reqQuiz"></h2>
    <div id="reqQuiz"></div>
  </section>

  <section id="model" class="section">
    <h1 data-i18n="h_model"></h1>
    <p class="lead" data-i18n="lead_model"></p>
    <div class="er-wrap"><svg id="erSvg" viewBox="0 0 1000 640" role="img" aria-label="ER diagram"></svg></div>
    <div class="panel" id="erDetails"><p class="muted" data-i18n="erPlaceholder"></p></div>
    <div id="modelExtra"></div>
  </section>

  <section id="etl" class="section">
    <h1 data-i18n="h_etl"></h1>
    <p class="lead" data-i18n="lead_etl"></p>
    <div id="etlDemos"></div>
  </section>

  <section id="sql" class="section">
    <h1 data-i18n="h_sql"></h1>
    <p class="lead" data-i18n="lead_sql"></p>
    <div class="tabs" id="sqlTabs" role="tablist"></div>
    <div id="sqlLesson"></div>
  </section>

  <section id="glossary" class="section">
    <h1 data-i18n="h_glossary"></h1>
    <input type="search" id="glossarySearch" class="search" data-i18n-placeholder="glossarySearch" aria-label="Search">
    <p class="muted" id="glossaryCount"></p>
    <div id="glossaryList" class="glossary"></div>
  </section>

  <section id="decisions" class="section">
    <h1 data-i18n="h_decisions"></h1>
    <p class="lead" data-i18n="lead_decisions"></p>
    <div id="adrList"></div>
  </section>

  <section id="charts" class="section">
    <h1 data-i18n="h_charts"></h1>
    <p class="lead" data-i18n="lead_charts"></p>
    <div id="chartList"></div>
  </section>

  <section id="pitfalls" class="section">
    <h1 data-i18n="h_pitfalls"></h1>
    <p class="lead" data-i18n="lead_pitfalls"></p>
    <div id="pitfallList" class="cards"></div>
  </section>

  <section id="interview" class="section">
    <h1 data-i18n="h_interview"></h1>
    <p class="lead" data-i18n="lead_interview"></p>
    <div class="row gap wrap" id="interviewFilters"></div>
    <div id="interviewList"></div>
  </section>

  <section id="selfcheck" class="section">
    <h1 data-i18n="h_selfcheck"></h1>
    <p class="lead" data-i18n="lead_selfcheck"></p>
    <div class="score" id="quizScore"></div>
    <div id="quizList"></div>
    <h2 data-i18n="h2_tasks"></h2>
    <div id="taskList"></div>
  </section>

  <footer class="footer muted" data-i18n="footer"></footer>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="content-1.js"></script>
<script src="content-2.js"></script>
<script src="content-3.js"></script>
<script src="content-1.en.js"></script>
<script src="content-2.en.js"></script>
<script src="content-3.en.js"></script>
<script src="app.js"></script>
</body>
</html>
